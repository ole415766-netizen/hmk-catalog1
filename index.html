// БАЗА ДАННЫХ INDEXEDDB
const DB_NAME = 'hmk_catalog_db_v7';
const STORE_NAME = 'catalog_store';
const LS_KEY = 'hmk_catalog_v4'; // Старый ключ для миграции
const DELETED_KEY = 'hmk_deleted_seeds_v1';

let items = [];
let currentPhoto = null;
let db = null;

function initDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME);
      }
    };
    req.onsuccess = e => { db = e.target.result; resolve(); };
    req.onerror = e => reject(e);
  });
}

function saveToDB(data) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    store.put(JSON.stringify(data), 'main_data');
    tx.oncomplete = () => resolve();
    tx.onerror = e => reject(e);
  });
}

function loadFromDB() {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const req = store.get('main_data');
    req.onsuccess = () => resolve(req.result ? JSON.parse(req.result) : null);
    req.onerror = e => reject(e);
  });
}
