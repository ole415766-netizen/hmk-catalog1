  h1{font-size:20px;margin-bottom:2px}
  .sub{color:#8a8175;font-size:12px;margin-bottom:12px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .stat{background:#fff;border-radius:12px;padding:10px 12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .stat b{display:block;font-size:18px;color:#8b5a2b}
  .stat span{font-size:11px;color:#8a8175}
  .filters{display:flex;gap:8px;margin-bottom:12px}
  input,select,textarea,button{font:inherit;font-size:15px;padding:11px 14px;
    border:1px solid #e2dbd0;border-radius:10px;background:#fff;color:#2c2c2c;width:100%}
  .filters input{flex:2}.filters select{flex:1;min-width:0}
  button{cursor:pointer;border:none;background:#8b5a2b;color:#fff;font-weight:600}
  button.sec{background:#e8e2d8;color:#4a3a2a}
  .section-header{display:flex;justify-content:space-between;align-items:baseline;
    padding:14px 6px 8px;margin-top:6px;border-bottom:2px solid #8b5a2b;
    position:sticky;top:0;background:#f5f2ec;z-index:10}
  .section-header .year{font-size:19px;font-weight:800;color:#8b5a2b;letter-spacing:.5px}
  .section-header .year-info{font-size:12px;color:#8a8175;font-weight:600}
  .section-first{margin-top:0}
  .card{background:#fff;border-radius:14px;padding:12px;margin-bottom:10px;
        box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .card-head{display:grid;grid-template-columns:88px 1fr;gap:12px;align-items:start}
  .card img,.card .noimg{width:88px;height:88px;object-fit:cover;border-radius:10px;
        background:#e8e2d8;display:flex;align-items:center;justify-content:center;
        color:#8a8175;font-size:11px;text-align:center}
  .card h3{font-size:15px;margin-bottom:4px;line-height:1.3}
  .tags{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
  .tag{font-size:10px;padding:2px 7px;border-radius:6px;background:#e8e2d8;
       color:#5a4a3a;font-weight:600}
  .tag.theme{background:#dbe9d8;color:#2e5d2c}
  .tag.rare{background:#f0d9c9;color:#8b4a1f}
  .tag.qty{background:#c8e6c9;color:#1b5e20}
  .price{font-size:15px;font-weight:700;color:#2e7d32;margin-top:4px}
  .comment{font-size:12px;color:#8a8175;margin-top:2px}
  .actions{display:flex;gap:8px;margin-top:10px}
  .actions button{flex:1;padding:9px;font-size:13px}
  .edit-form{margin-top:12px;border-top:1px dashed #d8d2c8;padding-top:12px;display:none}
  .edit-form.on{display:block}
  .field{margin-bottom:10px}
  .field label{display:block;font-size:12px;color:#8a8175;margin-bottom:4px;font-weight:600}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .preview{width:120px;border-radius:10px;margin-top:8px;display:block}
  .bottom{position:fixed;left:0;right:0;bottom:12px;padding:0 12px;
          display:flex;gap:6px;z-index:50;flex-wrap:wrap}
  .bottom button{box-shadow:0 4px 14px rgba(0,0,0,.15);padding:12px 8px;font-size:13px}
  .bottom .add{flex:1 1 100%}
  .bottom .half{flex:1 1 calc(50% - 3px)}
  .toast{position:fixed;bottom:130px;left:50%;transform:translateX(-50%);
    background:#2c2c2c;color:#fff;padding:10px 18px;border-radius:10px;
    font-size:14px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;
    max-width:90%;text-align:center}
  .toast.on{opacity:1}
</style>
</head>

 {name:"Крейсер «Киев»",year:"1984",denom:"5+1 коп.",theme:"Флот",cond:"Чистый",rare:"Обычный",pmin:50,pmax:150,comment:"Серия «Современные корабли ВМФ СССР». Крейсер «Киев». Дата выпуска — 24 октября 1983 г.",qty:2},
 {name:"Крылатка-зебра",year:"1984",denom:"5+1 коп.",theme:"Фауна",cond:"Чистый",rare:"Обычный",pmin:50,pmax:150,comment:"Коралловые рыбы. Крылатка-зебра. Дата выпуска — 7 декабря 1983 г.",qty:1},
 {name:"В. М. Глушков (1923–1982)",year:"1983",denom:"5+1 коп.",theme:"Наука",cond:"Чистый",rare:"Обычный",pmin:50,pmax:150,comment:"Академик В. М. Глушков. Дата выпуска — 1 февраля 1983 г.",qty:1}
];

function normName(s){
  return String(s||'').toLowerCase()
    .replace(/ё/g,'е')
    .replace(/[«»"'`]/g,'')
    .replace(/[.,;:!?()\-–—]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

function getDeletedSeeds(){
  try{return JSON.parse(localStorage.getItem(DELETED_KEY)||'[]');}catch(e){return[];}
}
function addDeletedSeed(name){
  const d=getDeletedSeeds();
  const k=normName(name);
  if(!d.includes(k)){d.push(k);localStorage.setItem(DELETED_KEY,JSON.stringify(d));}
}

function load(){
  let stored=null;
  try{
    const r=localStorage.getItem(LS_KEY);
    if(r)stored=JSON.parse(r);
  }catch(e){}

  const deleted=getDeletedSeeds();

  if(!stored||!stored.length){
    items=SEED.map((x,i)=>({...x,id:i+1,photo:null}));
  } else {
    items=stored;
    const existingNames=new Set(items.map(it=>normName(it.name)));
    let added=0;
    SEED.forEach(s=>{
      const k=normName(s.name);
      if(existingNames.has(k))return;
      if(deleted.includes(k))return;
      items.push({...s,id:0,photo:null});
      added++;
    });
    if(added>0){
      setTimeout(()=>toast('✨ Добавлено новых: '+added),400);
    }
  }

  items.forEach(it=>{
    if(it.year)it.year=String(it.year).replace(/-е$/,'').replace(/-х$/,'');
    if(!it.qty)it.qty=1; // дефолтное значение для старых записей
  });
  sortAndRenumber();
  save();
}

function sortAndRenumber(){
  items.sort((a,b)=>{
    const ya=(String(a.year||'').match(/\d+/)||['99999'])[0];
    const yb=(String(b.year||'').match(/\d+/)||['99999'])[0];
    if(ya!==yb)return ya.localeCompare(yb,undefined,{numeric:true});
    return (a.id||0)-(b.id||0);
  });
  items.forEach((it,i)=>{it.id=i+1;});
}

function save(){localStorage.setItem(LS_KEY,JSON.stringify(items));}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'),2200);
}

function render(){
  sortAndRenumber();
  const q=(document.getElementById('f-search').value||'').toLowerCase();
  const ft=document.getElementById('f-theme').value;
  const list=document.getElementById('list');list.innerHTML='';

  const themes=[...new Set(items.map(i=>i.theme).filter(Boolean))].sort();
  const sel=document.getElementById('f-theme');const cur=sel.value;
  sel.innerHTML='<option value="">Все</option>'+themes.map(t=>`<option ${t===cur?'selected':''}>${t}</option>`).join('');

  const filtered=items.filter(it=>(!q||it.name.toLowerCase().includes(q))&&(!ft||it.theme===ft));

  let sMin=0,sMax=0,totalCount=0;
  filtered.forEach(it=>{
    const cnt = it.qty || 1;
    sMin += (+it.pmin || 0) * cnt;
    sMax += (+it.pmax || 0) * cnt;
    totalCount += cnt;
  });

  const groups={};
  filtered.forEach(it=>{
    let y=(it.year||'').trim()||'Без года';
    y=y.replace(/-е$/,'').replace(/-х$/,'');
    if(!groups[y])groups[y]=[];
    groups[y].push(it);
  });

  const years=Object.keys(groups).sort((a,b)=>{
    if(a==='Без года')return 1;
    if(b==='Без года')return -1;
    return a.localeCompare(b,undefined,{numeric:true});
  });

  if(!filtered.length){
    list.innerHTML='<div style="text-align:center;padding:40px;color:#8a8175">Ничего не найдено</div>';
  }

  let firstSection=true;
  years.forEach(year=>{
    const group=groups[year];
    let gMin=0, gMax=0, gCount=0;
    
    group.forEach(it => {
      const cnt = it.qty || 1;
      gMin += (+it.pmin || 0) * cnt;
      gMax += (+it.pmax || 0) * cnt;
      gCount += cnt;
    });

    const header=document.createElement('div');
    header.className='section-header'+(firstSection?' section-first':'');
    header.innerHTML=`
      <span class="year">${esc(year)}</span>
      <span class="year-info">${gCount} шт. • ${gMin.toLocaleString('ru-RU')}–${gMax.toLocaleString('ru-RU')} ₽</span>
    `;
    list.appendChild(header);
    firstSection=false;

    group.forEach(it=>{
      const c=document.createElement('div');c.className='card';
      const ph=it.photo?`<img src="${it.photo}">`:`<div class="noimg">нет<br>фото</div>`;
      const qtyBadge = (it.qty && it.qty > 1) ? `<span class="tag qty">x${it.qty}</span>` : '';
      
      c.innerHTML=`
        <div class="card-head">
          ${ph}
          <div>
            <h3>№${it.id}. ${esc(it.name)}</h3>
            <div class="tags">
              ${it.year?`<span class="tag">${esc(it.year)}</span>`:''}
              ${it.denom?`<span class="tag">${esc(it.denom)}</span>`:''}
              ${it.theme?`<span class="tag theme">${esc(it.theme)}</span>`:''}
              ${it.rare?`<span class="tag rare">${esc(it.rare)}</span>`:''}
              ${it.cond?`<span class="tag">${esc(it.cond)}</span>`:''}
              ${qtyBadge}
            </div>
            <div class="price">${it.pmin||0}–${it.pmax||0} ₽</div>
            ${it.comment?`<div class="comment">${esc(it.comment)}</div>`:''}
          </div>
        </div>
        <div class="actions">
          <button class="sec" onclick="toggleEdit(${it.id})">✏ Изменить</button>
          <button class="sec" onclick="delItem(${it.id})">🗑 Удалить</button>
        </div>
        <div class="edit-form" id="form-${it.id}"></div>
      `;
      list.appendChild(c);
    });
  });

  document.getElementById('st-count').textContent=totalCount;
  document.getElementById('st-min').textContent=sMin.toLocaleString('ru-RU')+' ₽';
  document.getElementById('st-max').textContent=sMax.toLocaleString('ru-RU')+' ₽';
  document.getElementById('st-avg').textContent=Math.round((sMin+sMax)/2).toLocaleString('ru-RU')+' ₽';
}

function toggleEdit(id){
  const form=document.getElementById('form-'+id);
  if(!form)return;
  if(form.classList.contains('on')){form.classList.remove('on');form.innerHTML='';return;}
  const it=items.find(x=>x.id===id);
  if(!it)return;
  currentPhoto=it.photo||null;
  form.innerHTML=`
    <div class="field"><label>Фото</label>
      <input type="file" accept="image/*" onchange="onPhoto(event,${id})">
      <img class="preview" id="prev-${id}" ${currentPhoto?`src="${currentPhoto}"`:'style="display:none"'}>
    </div>
    <div class="field"><label>Название *</label><input id="f-name-${id}" value="${esc(it.name)}"></div>
    <div class="row2">
      <div class="field"><label>Год</label><input id="f-year-${id}" value="${esc(it.year)}"></div>
      <div class="field"><label>Номинал</label><input id="f-denom-${id}" value="${esc(it.denom)}"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Тема</label><input id="f-theme-${id}" value="${esc(it.theme)}"></div>
      <div class="field"><label>Каталог №</label><input id="f-cat-${id}" value="${esc(it.cat||'')}"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Состояние</label><input id="f-cond-${id}" value="${esc(it.cond||'Чистый')}"></div>
      <div class="field"><label>Редкость</label><input id="f-rare-${id}" value="${esc(it.rare||'Обычный')}"></div>
    </div>
    <div class="row3">
      <div class="field"><label>Кол-во (шт.)</label><input id="f-qty-${id}" type="number" min="1" value="${it.qty||1}"></div>
      <div class="field"><label>Цена от, ₽</label><input id="f-pmin-${id}" type="number" value="${it.pmin||0}"></div>
      <div class="field"><label>Цена до, ₽</label><input id="f-pmax-${id}" type="number" value="${it.pmax||0}"></div>
    </div>
    <div class="field"><label>Комментарий</label><textarea id="f-comment-${id}">${esc(it.comment||'')}</textarea></div>
    <div class="actions">
      <button class="sec" onclick="toggleEdit(${id})">Отмена</button>
      <button onclick="saveItem(${id})">Сохранить</button>
    </div>`;
  form.classList.add('on');
  setTimeout(()=>form.scrollIntoView({behavior:'smooth',block:'nearest'}),100);
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}

function onPhoto(e,id){
  const f=e.target.files[0];if(!f){toast('Файл не выбран');return;}
  const r=new FileReader();
  r.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const max=600;
      const s=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=img.width*s;c.height=img.height*s;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      currentPhoto=c.toDataURL('image/jpeg',0.75);
      const p=document.getElementById('prev-'+id);
      if(p){p.src=currentPhoto;p.style.display='block';}
      toast('Фото загружено ✅');
    };
    img.src=ev.target.result;
  };
  r.readAsDataURL(f);
}

function saveItem(id){
  const it=items.find(x=>x.id===id);if(!it)return;
  const name=document.getElementById('f-name-'+id).value.trim();
  if(!name){toast('Введите название');return;}
  it.name=name;
  let yr=document.getElementById('f-year-'+id).value.trim();
  yr=yr.replace(/-е$/,'').replace(/-х$/,'');
  it.year=yr;
  it.denom=document.getElementById('f-denom-'+id).value;
  it.theme=document.getElementById('f-theme-'+id).value;
  it.cat=document.getElementById('f-cat-'+id).value;
  it.cond=document.getElementById('f-cond-'+id).value;
  it.rare=document.getElementById('f-rare-'+id).value;
  it.qty=+document.getElementById('f-qty-'+id).value||1;
  it.pmin=+document.getElementById('f-pmin-'+id).value||0;
  it.pmax=+document.getElementById('f-pmax-'+id).value||0;
  it.comment=document.getElementById('f-comment-'+id).value;
  if(currentPhoto)it.photo=currentPhoto;
  sortAndRenumber();save();render();
  toast('Сохранено ✅');
}

function delItem(id){
  const it=items.find(x=>x.id===id);
  if(!it)return;
  if(!confirm('Удалить №'+id+'?'))return;
  const k=normName(it.name);
  if(SEED.some(s=>normName(s.name)===k))addDeletedSeed(it.name);
  items=items.filter(x=>x.id!==id);
  sortAndRenumber();save();render();
  toast('Удалено, нумерация обновлена');
}

function newItem(){
  items.push({id:0,name:"Новый конверт",year:"",denom:"",theme:"",cond:"Чистый",rare:"Обычный",qty:1,pmin:0,pmax:0,comment:"",photo:null});
  sortAndRenumber();save();render();
  const added=items.find(x=>x.name==="Новый конверт"&&!x.pmin&&!x.pmax);
  setTimeout(()=>{if(added)toggleEdit(added.id);},100);
}

function exportJSON(){
  const data={version:4,exportedAt:new Date().toISOString(),count:items.length,items:items};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const d=new Date().toISOString().slice(0,10);
  a.href=url;a.download='hmk-catalog-'+d+'.json';
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast('💾 Экспортировано: '+items.length+' записей');
}

function importJSON(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      const incoming=Array.isArray(data)?data:(data.items||[]);
      if(!Array.isArray(incoming)||!incoming.length){toast('Файл пустой или неверный');return;}

      const merge=confirm(
        'Как импортировать?\n\n'+
        '▶ ОК — ОБЪЕДИНИТЬ\n'+
        '(фото подтянутся к совпадающим, новые добавятся)\n\n'+
        '▶ Отмена — ЗАМЕНИТЬ\n'+
        '(вся текущая коллекция будет стёрта)'
      );

      const clean=incoming.map(it=>{
        let yr=String(it.year||'').trim().replace(/-е$/,'').replace(/-х$/,'');
        return{
          name:it.name||'Без названия',year:yr,denom:it.denom||'',
          theme:it.theme||'',cond:it.cond||'Чистый',rare:it.rare||'Обычный',
          qty:+it.qty||1,
          pmin:+it.pmin||0,pmax:+it.pmax||0,comment:it.comment||'',
          cat:it.cat||'',photo:it.photo||null
        };
      });

      if(merge){
        let updated=0,added=0,photoCount=0;
        clean.forEach(inc=>{
          const k=normName(inc.name);
          const ex=items.find(x=>normName(x.name)===k);
          if(ex){
            if(inc.photo&&!ex.photo){ex.photo=inc.photo;photoCount++;}
            if(!ex.year&&inc.year)ex.year=inc.year;
            if(!ex.denom&&inc.denom)ex.denom=inc.denom;
            if(!ex.theme&&inc.theme)ex.theme=inc.theme;
            if(!ex.comment&&inc.comment)ex.comment=inc.comment;
            if(inc.qty > (ex.qty||1)) ex.qty = inc.qty; // берем большее количество
            updated++;
          } else {
            items.push({...inc,id:(items.length?Math.max(...items.map(x=>x.id)):0)+added+1});
            added++;
          }
        });
        sortAndRenumber();save();render();
        toast('📂 Объединено: +'+added+' новых, '+photoCount+' фото');
      } else {
        items=clean.map((it,i)=>({...it,id:i+1}));
        sortAndRenumber();save();render();
        toast('📂 Заменено: '+items.length+' записей');
      }
    }catch(err){toast('Ошибка чтения файла');}
  };
  r.readAsText(f);
  e.target.value='';
}

load();render();
</script>
